[project]
name = "occultsky"
version = "0.1.0"
description = "A Python toolkit for searching historical lunar occultation events of planets and rendering night-sky charts, powered by Skyfield."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "yuliu", email = "yuliu@gzu.edu.cn" }
]
keywords = [
    "astronomy",
    "lunar-occultation",
    "historical-astronomy",
    "skyfield",
    "ephemeris",
    "star-chart",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
]
requires-python = ">=3.13"
dependencies = [
    "astroquery>=0.4.7",
    "astropy>=8.0.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "shapely>=2.1.2",
    "skyfield>=1.55",
    "typer>=0.27.1",
    "pyyaml>=6.0.3",
    "ruamel-yaml>=0.19.1",
]

[project.urls]
Homepage = "https://github.com/GZU-MuTian/occultsky"
Repository = "https://github.com/GZU-MuTian/occultsky"
Issues = "https://github.com/GZU-MuTian/occultsky/issues"

[project.scripts]
occultsky = "occultsky.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/output"]
