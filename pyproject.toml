[project]
name = "occultsky"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "yuliu", email = "yuliu@gzu.edu.cn" }
]
requires-python = ">=3.13"
dependencies = [
    "astropy>=8.0.1",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "skyfield>=1.55",
    "typer>=0.27.1",
]

[project.scripts]
occultsky = "occultsky.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
